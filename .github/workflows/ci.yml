name: CI

on:
  pull_request:

jobs:
  test:
    name: Run Java tests
    runs-on: ubuntu-latest
    env:
      APP_NAME: java-devcontainer-api
      APP_PORT: 8080
      APP_GREETING: Hello from my Java Dev Container!

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: mvn test

  docs:
    name: Build documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs
        run: python -m pip install mkdocs

      - name: Build documentation
        run: mkdocs build --strict